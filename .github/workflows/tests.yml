name: Healthcare System - Complete Test Suite

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Display Python version
      run: python --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography PyQt5
        pip install pytest pytest-cov coverage

    - name: Run crypto_utils tests
      run: |
        python -m pytest test_crypto_utils.py -v --tb=short --cov=crypto_utils --cov-report=xml

    - name: Run auth_system tests
      run: |
        python -m pytest test_auth_system.py -v --tb=short --cov=auth_system --cov-report=xml --cov-append

    - name: Run patient_records tests
      run: |
        python -m pytest test_patient_records.py -v --tb=short --cov=patient_records --cov-report=xml --cov-append

    - name: Run integration tests
      run: |
        python -m pytest test_integration.py -v --tb=short --cov-report=xml --cov-append

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: ${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort

    - name: Run flake8
      run: |
        # Stop on critical errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warnings only
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run black (check only)
      run: |
        black --check --diff .
      continue-on-error: true

    - name: Run pylint
      run: |
        pylint crypto_utils.py auth_system.py patient_records.py --exit-zero --max-line-length=127
      continue-on-error: true

    - name: Run isort check
      run: |
        isort --check-only --diff .
      continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety pip-audit

    - name: Run bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json --exclude ./venv,./htmlcov
      continue-on-error: true

    - name: Run safety check
      run: |
        safety check --json || true
      continue-on-error: true

    - name: Run pip-audit
      run: |
        pip-audit --desc || true
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: bandit-report.json

  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "Test suite completed!"
        echo "Check individual job results above for details."